<div class="container mt-4">
  <h3>Registrar Usuario</h3>
  <form [formGroup]="usuarioForm" (ngSubmit)="onSubmit()">

    <div class="mb-3">
      <label>Nombre</label>
      <input formControlName="nombre" class="form-control" required />
    </div>

    <div class="mb-3">
      <label>Correo</label>
      <input formControlName="correo" class="form-control" type="email" required />
    </div>

    <div class="mb-3">
      <label>Cédula</label>
      <input formControlName="cedula" class="form-control" required />
    </div>
  
    <div class="mb-3">
      <label>Contraseña</label>
      <input formControlName="passwordhash" class="form-control" type="password" required />
    </div>

    <!-- 👇 CAMBIO: de input a select dinámico -->
    <div class="mb-3">
      <label>Programa</label>
      <select formControlName="programaid" class="form-control" required>
        <option value="">Seleccione un programa</option>
        <option *ngFor="let p of programas" [value]="p.id">
          {{ p.nombre }}
        </option>
      </select>
    </div>
    

    <div class="form-group">
  <label for="tipoPrograma">Tipo de Programa</label>
  <select id="tipoPrograma" class="form-control" formControlName="tipoPrograma">
    <option value="">Seleccione tipo</option>
    <option value="Regular">Programa Regular</option>
    <option value="Especial">Programa Especial</option>
  </select>
</div>

    <div class="mb-3">
      <label>Rol</label>
      <select formControlName="rol" class="form-control" required>
        <option value="admin">Admin</option>
        <option value="docente">Docente</option>
        <option value="estudiante">Estudiante</option>
      </select>
    </div>

    <button type="submit" class="btn btn-success">Guardar</button>
  </form>
</div>
