<h2>Usuarios por Programa</h2>

<div>
  <label for="nombre">Buscar por Nombre:</label>
  <input type="text" id="nombre" [(ngModel)]="nombre" />
  <button (click)="buscarUsuario()">Buscar</button>
</div>

<p *ngIf="mensaje" style="color:red;">{{ mensaje }}</p>

<table *ngIf="usuarios.length > 0" border="1" style="width:100%; border-collapse: collapse;">
  <thead>
    <tr>
      <th>ID</th>
      <th>Nombre</th>
      <th>Correo</th>
      <th>Programa</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let u of usuarios">
      <td>{{ u.id }}</td>
      <td>{{ u.nombre }}</td>
      <td>{{ u.correo }}</td>
      <td>{{ u.programa?.nombre }}</td>
    </tr>
  </tbody>
</table>
